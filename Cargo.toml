[package]
name = "sigmaos-blender"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Blender project/file manager, reads .blend file metadata"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

[lib]
name = "sigmaos_blender"
path = "src/lib.rs"
